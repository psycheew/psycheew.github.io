name: GA4 Visitor Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ga4-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch GA4 total users
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: node tools/ga4-sync/index.mjs

      - name: Commit and push changed count
        id: commit
        run: |
          git add assets/data/analytics.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "chore: GA4 누적 방문자 수 갱신"
          # Rebase on concurrent Notion/content commits; never force-push.
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref master
